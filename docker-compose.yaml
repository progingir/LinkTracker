services:
  postgres:
    image: mirror.gcr.io/library/postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=scrapper
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka1:
    image: mirror.gcr.io/confluentinc/cp-kafka:7.4.4
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka1:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - CLUSTER_ID=HsZtPZ7YQ-2L0-V-HwLqHw
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka2:
    image: mirror.gcr.io/confluentinc/cp-kafka:7.4.4
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9094,CONTROLLER://:9093,INTERNAL://:29094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9094,INTERNAL://kafka2:29094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - CLUSTER_ID=HsZtPZ7YQ-2L0-V-HwLqHw
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka3:
    image: mirror.gcr.io/confluentinc/cp-kafka:7.4.4
    ports:
      - "9096:9096"
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9096,CONTROLLER://:9093,INTERNAL://:29096
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9096,INTERNAL://kafka3:29096
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - CLUSTER_ID=HsZtPZ7YQ-2L0-V-HwLqHw

  kafka-ui:
    image: mirror.gcr.io/provectuslabs/kafka-ui:latest
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka1:29092,kafka2:29094,kafka3:29096
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  valkey-node-1:
    image: mirror.gcr.io/bitnami/valkey:latest
    container_name: valkey-node-1
    environment:
      - VALKEY_PASSWORD=password123
    ports:
      - "6379:6379"
    volumes:
      - valkey_1_data:/bitnami/valkey/data

  valkey-node-2:
    image: mirror.gcr.io/bitnami/valkey:latest
    container_name: valkey-node-2
    environment:
      - VALKEY_PASSWORD=password123
    volumes:
      - valkey_2_data:/bitnami/valkey/data

  valkey-node-3:
    image: mirror.gcr.io/bitnami/valkey:latest
    container_name: valkey-node-3
    environment:
      - VALKEY_PASSWORD=password123
    volumes:
      - valkey_3_data:/bitnami/valkey/data

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    container_name: scrapper
    depends_on:
      postgres:
        condition: service_healthy
      kafka1:
        condition: service_started
    environment:
      - SERVER_PORT=8081
      - SPRING_GRPC_SERVER_PORT=9091
      - DATABASE_URL=jdbc:postgresql://postgres:5432/scrapper
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - SPRING_DATA_REDIS_HOST=valkey-node-1
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=password123
      - SPRING_LIQUIBASE_ENABLED=true
      - SPRING_LIQUIBASE_CHANGE_LOG=file:/app/migrations/master.xml
      - APP_GITHUB_URL=https://api.github.com
      - APP_GITHUB_TOKEN=dummy_token
      - APP_STACKOVERFLOW_URL=https://api.stackexchange.com/2.3
      - APP_STACKOVERFLOW_KEY=dummy_key
      - APP_STACKOVERFLOW_ACCESS_TOKEN=dummy_access_token
      - APP_BOT_CLIENT_BASE_URL=http://bot:8080
    ports:
      - "8081:8081"
      - "9091:9091"
    volumes:
      - ./migrations:/app/migrations
    dns:
      - 8.8.8.8
      - 1.1.1.1

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    depends_on:
      - scrapper
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - SPRING_GRPC_SERVER_PORT=9090
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - SPRING_DATA_REDIS_HOST=valkey-node-1
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=password123
      - APP_SCRAPPER_CLIENT_BASE_URL=http://scrapper:8081
      - APP_SCRAPPER_CLIENT_TYPE=http
    ports:
      - "8080:8080"
      - "9090:9090"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  postgres_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  valkey_1_data:
  valkey_2_data:
  valkey_3_data:
