server:
  port: 8081

spring:
  application:
    name: scrapper

app:
  bot:
    url: http://localhost:8080
  stackoverflow:
    url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
  github:
    url: https://api.github.com
    token: ${GITHUB_TOKEN}
  scheduler:
    interval: 30s
