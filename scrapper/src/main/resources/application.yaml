server:
  port: 8081

spring:
  application:
    name: scrapper
  grpc:
    server:
      port: 9091
    client:
      default-channel:
        address: static://${APP_BOT_HOST:localhost}:9090
        negotiation-type: plaintext
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scrapper}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: migrations/master.xml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  bot-client:
    base-url: "http://localhost:8080"
    grpc-channel-name: "bot-channel"
  stackoverflow:
    url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
  github:
    url: https://api.github.com
    token: ${GITHUB_TOKEN}
  scheduler:
    interval: 30s
    batch-size: 50
  database:
    access-type: jdbc
