app:
  database:
    access-type: jpa
  scheduler:
    interval: 10s
    threads-count: 2
    batch-size: 10
    max-links-per-run: 100
    error-threshold: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: link_updates
    partitions: 1
    replicas: 1
    min-insync-replicas: "1"
    outbox-check-interval: 10s
    outbox-cleanup-interval: 1m
  valkey:
    enabled: true
    ttl: 10m
    max-size: 1000
    nodes: 127.0.0.1:6379,127.0.0.1:6380,127.0.0.1:6381
    invalidation-topic: cache-invalidation
    password: ${VALKEY_PASSWORD:password123}

spring:
  application:
    name: scrapper
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/scrapper}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: false
  cache:
    type: caffeine
