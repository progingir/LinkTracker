app:
  database:
    access-type: jpa
  retry:
    statuses: 500,502,503,504,429
    initial-interval: 500ms
    multiplier: 1.0
  scheduler:
    interval: 10s
    threads-count: 2
    batch-size: 10
    max-links-per-run: 100
    error-threshold: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: link_updates
    partitions: 1
    replicas: 1
    min-insync-replicas: "1"
    outbox-check-interval: 10s
    outbox-cleanup-interval: 1m
  valkey:
    enabled: true
    ttl: 10m
    max-size: 1000
    nodes: 127.0.0.1:6379,127.0.0.1:6380,127.0.0.1:6381
    invalidation-topic: cache-invalidation
    password: ${VALKEY_PASSWORD:password123}

spring:
  application:
    name: scrapper
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/scrapper}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: false
  cache:
    type: caffeine

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 1s
  instances:
    scrapper:
      baseConfig: default
    github:
      baseConfig: default
    stackoverflow:
      baseConfig: default

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 10
      minimumRequiredCalls: 5
      failureRateThreshold: 50
      permittedCallsInHalfOpenState: 5
      waitDurationInOpenState: 1s
  instances:
    scrapper:
      baseConfig: default
    github:
      baseConfig: default
    stackoverflow:
      baseConfig: default

app.retry.statuses: 500,502,503,504,429
resilience4j.retry.instances.bot.baseConfig: default
resilience4j.circuitbreaker.instances.bot.baseConfig: default

resilience4j.ratelimiter:
  configs:
    default:
      limitForPeriod: 100
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
    ip-rate-limit:
      limitForPeriod: 50
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
